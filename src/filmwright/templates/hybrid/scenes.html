<!doctype html>
<!-- filmwright hybrid film (MIT): animated scenes and recorded clips in one film.
     Inputs: window.FILM = {brand, segments: [{kind, start, dur, ...params}], frame: {x, y, w, h}}.
     Clip segments draw only the window chrome; the recording is composited into FRAME afterwards.
     Output: window.TOTAL, window.SFX, window.renderAt(t), window.READY. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Space Grotesk";src:url("../../assets/fonts/SpaceGrotesk-Variable.ttf") format("truetype");font-weight:300 700}
@font-face{font-family:"IBM Plex Sans";src:url("../../assets/fonts/IBMPlexSans-Regular.ttf") format("truetype");font-weight:400 500}
@font-face{font-family:"IBM Plex Sans";src:url("../../assets/fonts/IBMPlexSans-SemiBold.ttf") format("truetype");font-weight:600}
@font-face{font-family:"IBM Plex Sans";src:url("../../assets/fonts/IBMPlexSans-Bold.ttf") format("truetype");font-weight:700}
html,body{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#0f1222}svg{display:block}
</style>
<script src="../../assets/motion.js"></script>
</head><body>
<svg id="root" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" class="acc" stop-opacity=".5"/><stop offset=".55" class="acc" stop-opacity=".14"/><stop offset="1" class="acc" stop-opacity="0"/></radialGradient>
  <radialGradient id="darkglow" cx=".5" cy=".45" r=".75"><stop offset="0" id="dg0"/><stop offset=".6" id="dg1"/><stop offset="1" id="dg2"/></radialGradient>
  <filter id="softdark" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".45"/></filter>
  <filter id="neon" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle id="dotc" cx="2" cy="2" r="1.6" opacity=".55"/></pattern>
</defs>
<rect width="1920" height="1080" fill="url(#darkglow)"/>
<rect width="1920" height="1080" fill="url(#dots)" opacity=".6"/>
<g id="bgfx"></g>
<g id="segs"></g>
</svg>
<script>
const NS = "http://www.w3.org/2000/svg", $ = id => document.getElementById(id);
function S(tag, a = {}, p = null, txt = null) { const e = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(a)) e.setAttribute(k, v); if (txt != null) e.textContent = txt; if (p) p.appendChild(e); return e; }
let seed = 5; const rnd = () => (seed = seed * 16807 % 2147483647, (seed - 1) / 2147483646);
const hex = h => { h = h.replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join(""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const mix = (a, b, k) => { const x = hex(a), y = hex(b); return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * k).toString(16).padStart(2, "0")).join(""); };
const FILM = window.FILM || {segments: [{kind: "title", start: 0, dur: 4, headline: "Meet Acme Tasks", sub: "Plan less. Do more."}, {kind: "clip", start: 4, dur: 5, label: "acme-tasks.example"}, {kind: "outro", start: 9, dur: 5}]};
const BR = Object.assign({wordmark: "ACME TASKS", tagline: "Plan less. Do more.", colors: {}}, FILM.brand || {});
const BC = Object.assign({bg: "#0f1222", accent: "#7c5cff", alt: "#22c55e", warm: "#ff8a4c", ink: "#f4f5fb"}, BR.colors || {});
const C = {bg: BC.bg, panel: mix(BC.bg, "#ffffff", .05), panel2: mix(BC.bg, "#ffffff", .09), line: mix(BC.bg, BC.accent, .3),
  accent: BC.accent, accent2: mix(BC.accent, "#ffffff", .28), alt: BC.alt, warm: BC.warm, text: BC.ink, muted: mix(BC.ink, BC.bg, .38)};
const F = {disp: "Space Grotesk, Arial, sans-serif", body: "IBM Plex Sans, Arial, sans-serif"};
document.querySelectorAll(".acc").forEach(s => s.setAttribute("stop-color", C.accent));
$("dg0").setAttribute("stop-color", mix(BC.bg, BC.accent, .3)); $("dg1").setAttribute("stop-color", mix(BC.bg, BC.accent, .08)); $("dg2").setAttribute("stop-color", mix(BC.bg, "#000000", .25));
$("dotc").setAttribute("fill", mix(BC.bg, BC.accent, .45));
const FR = Object.assign({x: 200, y: 150, w: 1520, h: 855}, FILM.frame || {});
const SEGS = FILM.segments;
const last = SEGS[SEGS.length - 1];
const TOTAL = last.start + last.dur + .6;
const SFX = []; const cue = (t, n) => SFX.push([+t.toFixed(3), n]);
const tl = motion.timeline({paused: true});
const Q = t => Math.round(t / .25) * .25;

function fit(el, maxw) { if (el.getComputedTextLength() > maxw) { el.setAttribute("textLength", maxw); el.setAttribute("lengthAdjust", "spacingAndGlyphs"); } }
function logoMark(parent, cx, cy, s, glow = true) {

  const tile = S("path", {d: "M-70 -110 H70 Q110 -110 110 -70 V70 Q110 110 70 110 H-70 Q-110 110 -110 70 V-70 Q-110 -110 -70 -110 Z", stroke: C.accent2, "stroke-width": 16, fill: "none"}, g);
  const nodes = [];
  if (BR.logo) nodes.push(S("image", {href: BR.logo, x: -86, y: -86, width: 172, height: 172, preserveAspectRatio: "xMidYMid meet"}, g));
  else nodes.push(S("text", {x: 0, y: 46, "text-anchor": "middle", "font-family": F.disp, "font-weight": 700, "font-size": 140, fill: "#FFFFFF"}, g, (BR.monogram || BR.wordmark || "A").trim()[0]));
  const pin = S("circle", {cx: 104, cy: -104, r: 24, fill: C.alt, stroke: C.bg, "stroke-width": 8}, g);

function drawLogo(m, t) {

}
function words(parent, x, y, str, size, col, weight, anchor = "middle", family = F.disp) {
  const t = S("text", {x, y, "text-anchor": anchor, "font-family": family, "font-weight": weight, "font-size": size, fill: col}, parent);
  const sp = String(str || "").split(" ").map((w, i) => S("tspan", {}, t, (i ? " " : "") + w));

}
function reveal(sp, t, step = .08) { motion.set(sp, {opacity: 0}); sp.forEach((s, i) => tl.to(s, {opacity: 1, duration: .16}, t + i * step)); }
/* every segment enters and leaves the same way, so cuts land cleanly on the beat */

  motion.set(g, {opacity: 0});

}

const KINDS = {
  title(g, s) {
    const m = logoMark(g, 960, 360, .8); drawLogo(m, s.start + .2);
    const h = words(g, 960, 620, s.headline || `Meet ${BR.wordmark}`, 84, "#FFFFFF", 700);
    reveal(h.sp, s.start + .7);
    if (s.sub) { const sub = S("text", {x: 960, y: 700, "text-anchor": "middle", "font-family": F.body, "font-weight": 500, "font-size": 38, fill: C.muted}, g, s.sub); fit(sub, 1500); motion.set(sub, {opacity: 0, y: 20}); tl.to(sub, {opacity: 1, y: 0, duration: .5, ease: "power3.out"}, s.start + 1.4); }
    cue(s.start + .2, "chime");
  },
  statement(g, s) {
    const lines = String(s.text || "").split("\n");
    lines.forEach((ln, k) => { const w = words(g, 960, 540 - (lines.length - 1) * 55 + k * 110, ln, 92, k === lines.length - 1 && s.highlight !== false && lines.length > 1 ? C.accent2 : "#FFFFFF", 700); reveal(w.sp, Q(s.start + .3 + k * .6), .1); });
    if (s.sub) { const sub = S("text", {x: 960, y: 540 + lines.length * 55 + 70, "text-anchor": "middle", "font-family": F.body, "font-weight": 500, "font-size": 36, fill: C.muted}, g, s.sub); fit(sub, 1500); motion.set(sub, {opacity: 0}); tl.to(sub, {opacity: 1, duration: .5}, s.start + 1.2); }
  },
  steps(g, s) {
    const items = (s.items || []).slice(0, 5);
    if (s.title) { const t = S("text", {x: 960, y: 230, "text-anchor": "middle", "font-family": F.disp, "font-weight": 700, "font-size": 64, fill: "#FFFFFF"}, g, s.title); fit(t, 1600); motion.set(t, {opacity: 0, y: 20}); tl.to(t, {opacity: 1, y: 0, duration: .45, ease: "power3.out"}, s.start + .1); }

      const y = 330 + k * 128, c = S("g", {}, g);
      S("rect", {x: 460, y, width: 1000, height: 104, rx: 26, fill: C.panel, stroke: C.line, "stroke-width": 2}, c);
      S("circle", {cx: 520, cy: y + 52, r: 30, fill: [C.accent, C.alt, C.warm][k % 3]}, c);
      S("text", {x: 520, y: y + 63, "text-anchor": "middle", "font-family": F.disp, "font-weight": 700, "font-size": 30, fill: "#FFFFFF"}, c, String(k + 1));
      const tx = S("text", {x: 580, y: y + 64, "font-family": F.body, "font-weight": 600, "font-size": 34, fill: C.text}, c, it); fit(tx, 840);

  },
  stat(g, s) {
    S("circle", {cx: 960, cy: 470, r: 330, fill: "url(#glow)"}, g);
    const n = S("text", {x: 960, y: 560, "text-anchor": "middle", "font-family": F.disp, "font-weight": 700, "font-size": 240, fill: "#FFFFFF"}, g, "0");
    const val = +s.value || 0, dec = String(s.value).includes(".") ? 1 : 0, o = {v: 0};
    tl.to(o, {v: val, duration: Math.min(1.8, s.dur * .5), ease: "power2.out", onUpdate() { n.textContent = (s.prefix || "") + o.v.toFixed(dec) + (s.suffix || ""); }}, s.start + .3);
    const l = S("text", {x: 960, y: 680, "text-anchor": "middle", "font-family": F.body, "font-weight": 600, "font-size": 44, fill: C.muted}, g, s.label || ""); fit(l, 1500);
    motion.set(l, {opacity: 0, y: 20}); tl.to(l, {opacity: 1, y: 0, duration: .5, ease: "power3.out"}, s.start + 1.0); cue(s.start + 1.0, "pop");
  },
  clip(g, s) {

    [0, 1, 2].forEach(k => S("circle", {cx: FR.x + 14 + k * 26, cy: FR.y - bar / 2 - pad / 2 + 2, r: 8, fill: ["#FF6B5B", "#FFC247", C.alt][k]}, g));
    if (s.label) { const lb = S("text", {x: FR.x + FR.w / 2, y: FR.y - bar / 2 - pad / 2 + 10, "text-anchor": "middle", "font-family": F.body, "font-weight": 600, "font-size": 22, fill: C.muted}, g, s.label); fit(lb, 900); }

  },
  outro(g, s) {
    S("circle", {cx: 960, cy: 400, r: 300, fill: "url(#glow)"}, g);
    const m = logoMark(g, 960, 400, .9); drawLogo(m, s.start + .2); cue(s.start + .2, "chime");
    const wm = S("text", {x: 960, y: 690, "text-anchor": "middle", "font-family": F.disp, "font-weight": 700, "font-size": 76, "letter-spacing": 14, fill: "#FFFFFF"}, g, BR.wordmark); fit(wm, 1600);
    const tg = S("text", {x: 960, y: 760, "text-anchor": "middle", "font-family": F.body, "font-weight": 500, "font-size": 36, fill: C.muted}, g, s.tagline || BR.tagline); fit(tg, 1500);

    tl.to(tg, {opacity: 1, y: 0, duration: .5, ease: "power3.out"}, s.start + 1.0);
    const cta = s.cta || BR.url;
    if (cta) {
      const c = S("g", {}, g);
      const r = S("rect", {x: 760, y: 810, width: 400, height: 76, rx: 38, fill: C.accent}, c);
      const t = S("text", {x: 960, y: 860, "text-anchor": "middle", "font-family": F.body, "font-weight": 700, "font-size": 30, fill: "#FFFFFF"}, c, cta);
      const w = Math.min(1200, t.getComputedTextLength() + 90); r.setAttribute("width", w); r.setAttribute("x", 960 - w / 2);
      motion.set(c, {opacity: 0, scale: .7, svgOrigin: "960 848"}); tl.to(c, {opacity: 1, scale: 1, duration: .45, ease: "back.out(2.4)"}, Q(s.start + 1.5)); cue(Q(s.start + 1.5), "jingle_out");
    }
  },
};

/* ---- richer scenes: chart, headline (kinetic type), device frames, ui (product UI with a cursor) ---------------- */
const DEFS = document.querySelector("#root defs");
let gid = 0;
function grad(stops, x2 = 0, y2 = 1) {
  const id = "g" + (++gid), lg = S("linearGradient", {id, x1: 0, y1: 0, x2, y2}, DEFS);

function blurFilter(sd) { const id = "b" + (++gid), f = S("filter", {id, x: "-30%", y: "-30%", width: "160%", height: "160%"}, DEFS); S("feGaussianBlur", {stdDeviation: sd}, f); return `url(#${id})`; }
function label(parent, x, y, str, size, col, weight = 600, anchor = "start", family = F.body) {

  if (s.title) { const t = label(g, 960, y, s.title, 60, "#FFFFFF", 700, "middle", F.disp); fit(t, 1500); rise(t, s.start + .15); }
  if (s.sub) { const t = label(g, 960, y + 58, s.sub, 30, C.muted, 500, "middle"); fit(t, 1400); rise(t, s.start + .4); }
}
const nice = v => Math.abs(v) >= 1000 ? Math.round(v).toLocaleString("en-US") : (Math.round(v * 10) / 10).toString();

Object.assign(KINDS, {
  chart(g, s) {
    const data = (s.data || [{label: "Jan", value: 12}, {label: "Feb", value: 18}, {label: "Mar", value: 26}, {label: "Apr", value: 41}]).slice(0, 8);
    const kind = s.type || "bar", n = data.length, unit = s.unit || "", pre = s.prefix || "";
    const hi = s.highlight == null ? n - 1 : (typeof s.highlight === "number" ? s.highlight : data.findIndex(d => d.label === s.highlight));
    heading(g, s, 170);
    const X0 = 360, X1 = 1560, Y0 = 850, YT = s.title ? 340 : 260, H = Y0 - YT;
    const peak = Math.max(...data.map(d => +d.value)) * 1.08 || 1;
    const mag = Math.pow(10, Math.floor(Math.log10(peak / 4))), step = [1, 2, 2.5, 3, 4, 5, 10].map(m => m * mag).find(v => v * 4 >= peak);
    const max = step * 4;
    const card = S("rect", {x: X0 - 120, y: YT - 60, width: X1 - X0 + 200, height: H + 150, rx: 28, fill: C.panel, stroke: C.line, "stroke-width": 1.5, filter: "url(#softdark)"}, g);
    rise(card, s.start + .05, .6, 30);
    for (let k = 0; k <= 4; k++) {
      const y = Y0 - k / 4 * H;
      const gl = S("path", {d: `M${X0} ${y} H${X1}`, stroke: k ? mix(C.panel, C.text, .12) : mix(C.panel, C.text, .3), "stroke-width": k ? 1.5 : 2.5, fill: "none"}, g);
      drawLine(gl, s.start + .25 + k * .05, .7);
      const v = label(g, X0 - 24, y + 8, pre + nice(step * k) + unit, 22, C.muted, 500, "end"); rise(v, s.start + .35 + k * .05, .4, 0);
    }
    const slot = (X1 - X0) / n, bw = Math.min(150, slot * .56);
    const px = i => X0 + slot * (i + .5), py = v => Y0 - (+v / max) * H;

    const hiFill = grad([[0, C.accent2], [1, C.accent]]), loFill = grad([[0, mix(C.panel2, C.accent, .45)], [1, mix(C.panel2, C.accent, .18)]]);
    const vals = [];
    data.forEach((d, i) => {

        if (i === hi) { const glow = S("rect", {x: px(i) - bw / 2 - 10, y: py(d.value) - 10, width: bw + 20, height: Y0 - py(d.value) + 10, rx: 18, fill: C.accent, opacity: 0, filter: blurFilter(16)}, g); g.insertBefore(glow, b); tl.to(glow, {opacity: .45, duration: .6}, at + .7); }

      const dpath = pts.map((p, i) => (i ? "L" : "M") + p[0] + " " + p[1]).join(" ");
      const area = S("path", {d: `${dpath} L${pts[n - 1][0]} ${Y0} L${pts[0][0]} ${Y0} Z`, fill: grad([[0, C.accent, .35], [1, C.accent, 0]])}, g);

      drawLine(ln, t0, Math.max(.9, n * per + .4), "power2.inOut");
      pts.forEach((p, i) => { const dot = S("circle", {cx: p[0], cy: p[1], r: i === hi ? 13 : 9, fill: i === hi ? "#FFFFFF" : C.accent2, stroke: C.accent, "stroke-width": 4}, g); motion.set(dot, {scale: 0, svgOrigin: `${p[0]} ${p[1]}`}); tl.to(dot, {scale: 1, duration: .35, ease: "back.out(2.5)"}, t0 + i * per + .2); });
      const ring = S("circle", {cx: pts[hi][0], cy: pts[hi][1], r: 13, fill: "none", stroke: C.accent2, "stroke-width": 3}, g);
      motion.set(ring, {opacity: 0}); const rt = t0 + n * per + .5;
      [0, 1.3].forEach(d => { tl.set(ring, {attr: {r: 13}, opacity: .9}, rt + d); tl.to(ring, {attr: {r: 46}, opacity: 0, duration: 1.2, ease: "power2.out"}, rt + d); });

    }
    if (s.note) {
      const nx = px(hi), ny = py(data[hi].value) - 96, c = S("g", {}, g);
      const r = S("rect", {x: nx - 120, y: ny - 44, width: 240, height: 62, rx: 31, fill: C.alt}, c);
      const t = label(c, nx, ny - 3, s.note, 28, "#0b1220", 700, "middle", F.disp);
      const w = Math.max(160, t.getComputedTextLength() + 56); r.setAttribute("width", w); r.setAttribute("x", nx - w / 2);
      S("path", {d: `M${nx - 12} ${ny + 18} L${nx} ${ny + 32} L${nx + 12} ${ny + 18} Z`, fill: C.alt}, c);
      const at = Q(t0 + n * per + .7);
      motion.set(c, {opacity: 0, scale: .6, svgOrigin: `${nx} ${ny + 30}`}); tl.to(c, {opacity: 1, scale: 1, duration: .45, ease: "back.out(2.2)"}, at); cue(at, "pop");
    }
  },

  headline(g, s) {
    // kinetic type: words arrive in the rhythm of the line; *starred* words are marked in the accent colour
    const lines = String(s.text || "Plan less. *Do more.*").split("\n");
    const size = s.size || (lines.length > 2 ? 92 : 112), lh = size * 1.18;
    const all = [];
    const top = 540 - (lines.length - 1) * lh / 2 - (s.sub ? 40 : 0);
    lines.forEach((ln, li) => {
      const y = top + li * lh + size * .35, row = S("g", {}, g), items = [];
      let x = 0;
      const space = (() => { const t = label(row, 0, 0, "a a", size, "#fff", 700, "start", F.disp); const w2 = t.getComputedTextLength(); t.textContent = "aa"; const w1 = t.getComputedTextLength(); t.remove(); return w2 - w1; })();
      ln.split(/\s+/).filter(Boolean).forEach(raw => {
        const em = /^\*.*\*[.,!?:;]?$/.test(raw) || /^\*/.test(raw) && raw.endsWith("*");
        const word = raw.replace(/\*/g, "");
        const t = label(row, x, y, word, size, em ? C.accent2 : "#FFFFFF", 700, "start", F.disp);
        const w = t.getComputedTextLength();
        items.push({t, x, w, em}); x += w + space;
      });
      const width = x - space, off = 960 - width / 2;
      items.forEach(it => {
        it.t.setAttribute("x", it.x + off);
        if (it.em) {
          const m = S("rect", {x: it.x + off - 10, y: y - size * .32, width: it.w + 20, height: size * .42, rx: 8, fill: C.accent, opacity: .28}, row);
          row.insertBefore(m, it.t); it.mark = m;
        }
        all.push(it);
      });
    });
    const span = Math.min(s.dur * .55, all.length * .32), t0 = s.start + .25;
    all.forEach((it, i) => {
      const at = t0 + (all.length > 1 ? i / (all.length - 1) : 0) * span;
      motion.set(it.t, {opacity: 0, y: size * .45});
      tl.to(it.t, {opacity: 1, y: 0, duration: .5, ease: "power4.out"}, at);
      if (it.mark) { motion.set(it.mark, {scaleX: 0, svgOrigin: `${+it.mark.getAttribute("x")} 0`}); tl.to(it.mark, {scaleX: 1, duration: .45, ease: "power3.inOut"}, at + .3); }
    });
    if (s.sub) { const sub = label(g, 960, top + lines.length * lh + 30, s.sub, 36, C.muted, 500, "middle"); fit(sub, 1500); rise(sub, t0 + span + .3); }
    tl.fromTo(g, {scale: 1}, {scale: 1.035, svgOrigin: "960 540", duration: s.dur, ease: "none"}, s.start);   // a slow push-in keeps type alive
  },

  device(g, s) {
    // a laptop and a phone with depth; screens show your screenshots (image, phone_image) or a generated app
    const which = s.device || "both", laptop = which !== "phone", phone = which !== "laptop";
    heading(g, s, 150);
    const LX = phone && laptop ? 250 : 410, LY = s.title ? 290 : 240, LW = 1100, LH = 640;
    const shadow = blurFilter(26);
    const scene = S("g", {}, g);
    const app = (parent, x, y, w, h, mobile) => {     // a generated, on-brand dashboard
      const a = S("g", {}, parent);
      S("rect", {x, y, width: w, height: h, fill: mix(BC.bg, "#ffffff", .03)}, a);
      S("rect", {x, y, width: w, height: mobile ? h * .09 : h * .075, fill: C.panel2}, a);
      label(a, x + w * .04, y + (mobile ? h * .06 : h * .05), BR.wordmark, mobile ? 18 : 20, C.text, 700, "start", F.disp);
      const cards = [];
      if (!mobile) {
        S("rect", {x, y: y + h * .075, width: w * .17, height: h * .925, fill: C.panel}, a);
        [0, 1, 2, 3, 4].forEach(k => S("rect", {x: x + w * .025, y: y + h * (.14 + k * .08), width: w * .12, height: h * .035, rx: 6, fill: k ? mix(C.panel, C.text, .1) : C.accent}, a));
        [0, 1, 2].forEach(k => { const c = S("g", {}, a); S("rect", {x: x + w * (.2 + k * .26), y: y + h * .13, width: w * .24, height: h * .2, rx: 12, fill: C.panel2, stroke: C.line}, c);
          label(c, x + w * (.215 + k * .26), y + h * .2, ["Tasks", "Done", "Hours saved"][k], 16, C.muted, 600);
          label(c, x + w * (.215 + k * .26), y + h * .29, ["128", "96", "11 h"][k], 34, "#fff", 700, "start", F.disp); cards.push(c); });
        const ch = S("g", {}, a); S("rect", {x: x + w * .2, y: y + h * .38, width: w * .76, height: h * .55, rx: 12, fill: C.panel2, stroke: C.line}, ch);
        [.35, .5, .42, .62, .55, .78, .9].forEach((v, k) => { const bx = x + w * (.24 + k * .1), bh = h * .42 * v; const b = S("rect", {x: bx, y: y + h * .9 - bh, width: w * .06, height: bh, rx: 6, fill: k === 6 ? C.accent : mix(C.panel2, C.accent, .4)}, ch);
          motion.set(b, {scaleY: 0, svgOrigin: `${bx} ${y + h * .9}`}); cards.push({bar: b}); });
        cards.push(ch);
      } else {
        [0, 1, 2, 3, 4].forEach(k => { const c = S("g", {}, a); S("rect", {x: x + w * .06, y: y + h * (.13 + k * .155), width: w * .88, height: h * .13, rx: 14, fill: C.panel2, stroke: C.line}, c);
          S("circle", {cx: x + w * .17, cy: y + h * (.195 + k * .155), r: w * .045, fill: [C.accent, C.alt, C.warm][k % 3]}, c);
          S("rect", {x: x + w * .27, y: y + h * (.17 + k * .155), width: w * (.4 + (k % 2) * .15), height: h * .02, rx: 4, fill: mix(C.panel2, C.text, .5)}, c);
          S("rect", {x: x + w * .27, y: y + h * (.205 + k * .155), width: w * .3, height: h * .015, rx: 4, fill: mix(C.panel2, C.text, .22)}, c); cards.push(c); });
      }
      return cards;
    };
    const screen = (parent, x, y, w, h, img, mobile, r) => {
      const clipId = "c" + (++gid), cp = S("clipPath", {id: clipId}, DEFS); S("rect", {x, y, width: w, height: h, rx: r}, cp);
      const sc = S("g", {"clip-path": `url(#${clipId})`}, parent);
      let parts = [];
      if (img) S("image", {href: img, x, y, width: w, height: h, preserveAspectRatio: "xMidYMin slice"}, sc);
      else parts = app(sc, x, y, w, h, mobile);
      S("rect", {x, y, width: w, height: h, fill: grad([[0, "#ffffff", .1], [.45, "#ffffff", 0]], 1, 1)}, sc);   // glass
      return parts;
    };
    let lap = null, ph = null, lparts = [], pparts = [];
    if (laptop) {
      lap = S("g", {}, scene);
      S("ellipse", {cx: LX + LW / 2, cy: LY + LH + 70, rx: LW * .55, ry: 28, fill: "#000", opacity: .55, filter: shadow}, lap);
      S("rect", {x: LX, y: LY, width: LW, height: LH, rx: 26, fill: "#0a0c16", stroke: mix("#0a0c16", "#ffffff", .22), "stroke-width": 3}, lap);
      S("circle", {cx: LX + LW / 2, cy: LY + 15, r: 4, fill: "#2a2f45"}, lap);
      lparts = screen(lap, LX + 22, LY + 30, LW - 44, LH - 52, s.image, false, 8);
      S("path", {d: `M${LX - 70} ${LY + LH + 6} H${LX + LW + 70} L${LX + LW + 40} ${LY + LH + 44} Q${LX + LW / 2} ${LY + LH + 56} ${LX - 40} ${LY + LH + 44} Z`, fill: grad([[0, "#c9cede"], [1, "#7c8296"]])}, lap);
      S("rect", {x: LX + LW / 2 - 90, y: LY + LH + 6, width: 180, height: 10, rx: 5, fill: "#9aa0b4"}, lap);
    }
    if (phone) {
      const PW = 330, PH = 680, PX = laptop ? 1290 : 795, PY = laptop ? LY + 120 : LY - 10;
      ph = S("g", {}, scene);
      S("ellipse", {cx: PX + PW / 2, cy: PY + PH + 26, rx: PW * .55, ry: 18, fill: "#000", opacity: .5, filter: shadow}, ph);
      S("rect", {x: PX, y: PY, width: PW, height: PH, rx: 54, fill: "#0a0c16", stroke: mix("#0a0c16", "#ffffff", .3), "stroke-width": 3}, ph);
      pparts = screen(ph, PX + 14, PY + 14, PW - 28, PH - 28, s.phone_image, true, 42);
      S("rect", {x: PX + PW / 2 - 54, y: PY + 28, width: 108, height: 30, rx: 15, fill: "#05060c"}, ph);
      motion.set(ph, {svgOrigin: `${PX + PW / 2} ${PY + PH}`});
    }
    const t0 = s.start + .15;
    if (lap) { motion.set(lap, {opacity: 0, y: 90}); tl.to(lap, {opacity: 1, y: 0, duration: .9, ease: "power3.out"}, t0); tl.to(lap, {x: -14, duration: s.dur, ease: "sine.inOut"}, t0); }
    if (ph) { motion.set(ph, {opacity: 0, x: 160, rotation: 8}); tl.to(ph, {opacity: 1, x: 0, rotation: 3, duration: 1.0, ease: "power3.out"}, t0 + (lap ? .5 : 0)); tl.to(ph, {y: -12, duration: s.dur, ease: "sine.inOut"}, t0 + .5); }
    [...lparts, ...pparts].forEach((p, k) => {
      const at = t0 + .7 + k * .07;
      if (p.bar) tl.to(p.bar, {scaleY: 1, duration: .6, ease: "power3.out"}, at + .3);
      else { motion.set(p, {opacity: 0, y: 14}); tl.to(p, {opacity: 1, y: 0, duration: .4, ease: "power2.out"}, at); }
    });
  },

  ui(g, s) {
    // a product screen and a cursor that does what the narration says: click, type, add, tick, toast
    const WX = 250, WY = 120, WW = 1420, WH = 840, SB = 270;
    const win = S("g", {}, g);
    S("rect", {x: WX, y: WY, width: WW, height: WH, rx: 26, fill: mix(BC.bg, "#ffffff", .035), stroke: C.line, "stroke-width": 2, filter: "url(#softdark)"}, win);
    S("path", {d: `M${WX} ${WY + 26} Q${WX} ${WY} ${WX + 26} ${WY} H${WX + WW - 26} Q${WX + WW} ${WY} ${WX + WW} ${WY + 26} V${WY + 58} H${WX} Z`, fill: C.panel2}, win);
    [0, 1, 2].forEach(k => S("circle", {cx: WX + 30 + k * 26, cy: WY + 29, r: 8, fill: ["#FF6B5B", "#FFC247", C.alt][k]}, win));
    label(win, WX + WW / 2, WY + 37, s.app || BR.wordmark, 20, C.muted, 600, "middle");
    S("rect", {x: WX, y: WY + 58, width: SB, height: WH - 58, fill: C.panel}, win);
    S("path", {d: `M${WX} ${WY + WH - 26} Q${WX} ${WY + WH} ${WX + 26} ${WY + WH} H${WX + SB} V${WY + 58} H${WX} Z`, fill: C.panel}, win);
    const nav = s.nav || ["Inbox", "Today", "Projects", "Reports", "Settings"];
    nav.forEach((n2, k) => { const y = WY + 110 + k * 64;
      if (k === (s.active || 1)) S("rect", {x: WX + 16, y: y - 32, width: SB - 32, height: 48, rx: 12, fill: mix(C.panel, C.accent, .28)}, win);
      S("rect", {x: WX + 34, y: y - 19, width: 22, height: 22, rx: 6, fill: k === (s.active || 1) ? C.accent2 : mix(C.panel, C.text, .3)}, win);
      label(win, WX + 72, y - 1, n2, 22, k === (s.active || 1) ? "#fff" : C.muted, 600); });
    const MX = WX + SB + 56, MW = WW - SB - 112;
    label(win, MX, WY + 140, s.title || "This week", 44, "#fff", 700, "start", F.disp);
    label(win, MX, WY + 180, s.sub || "4 open · 2 done", 22, C.muted, 500);
    const IY = WY + 220, BW = 180;
    S("rect", {x: MX, y: IY, width: MW - BW - 20, height: 64, rx: 14, fill: C.panel2, stroke: C.line, "stroke-width": 2}, win);
    const ph = label(win, MX + 24, IY + 41, s.placeholder || "Add a task…", 24, C.muted, 500);
    const typed = label(win, MX + 24, IY + 41, "", 24, "#fff", 500);
    const caret = S("rect", {x: MX + 24, y: IY + 18, width: 3, height: 30, fill: C.accent2, opacity: 0}, win);
    const btn = S("g", {}, win);
    S("rect", {x: MX + MW - BW, y: IY, width: BW, height: 64, rx: 14, fill: C.accent}, btn);
    label(btn, MX + MW - BW / 2, IY + 41, s.button || "Add task", 24, "#fff", 700, "middle");
    motion.set(btn, {svgOrigin: `${MX + MW - BW / 2} ${IY + 32}`});
    const RY = IY + 104, RH = 76;
    const people = ["Maya", "Raj", "Lee", "Ana", "Kit"];
    const mkRow = (text, k, done) => {
      const r = S("g", {}, win), y = RY + k * (RH + 12);
      S("rect", {x: MX, y, width: MW, height: RH, rx: 16, fill: C.panel, stroke: C.line, "stroke-width": 1.5}, r);
      const box = S("rect", {x: MX + 24, y: y + 24, width: 28, height: 28, rx: 8, fill: done ? C.alt : "none", stroke: done ? C.alt : C.muted, "stroke-width": 2.5}, r);
      const tick = S("path", {d: `M${MX + 31} ${y + 38} l6 6 l11 -12`, stroke: "#0b1220", "stroke-width": 3.5, fill: "none", "stroke-linecap": "round", opacity: done ? 1 : 0}, r);
      const tx = label(r, MX + 74, y + 47, text, 26, done ? C.muted : C.text, 500);
      const strike = S("path", {d: `M${MX + 70} ${y + 39} h${tx.getComputedTextLength() + 8}`, stroke: C.muted, "stroke-width": 2.5, opacity: done ? 1 : 0}, r);
      const who = people[k % people.length];
      S("rect", {x: MX + MW - 230, y: y + 21, width: 96, height: 34, rx: 17, fill: mix(C.panel, C.warm, .2)}, r);
      label(r, MX + MW - 182, y + 45, ["Mon", "Tue", "Wed", "Thu", "Fri"][k % 5], 18, C.warm, 600, "middle");
      S("circle", {cx: MX + MW - 64, cy: y + 38, r: 22, fill: [C.accent, C.alt, C.warm][k % 3]}, r);
      label(r, MX + MW - 64, y + 46, who[0], 22, "#fff", 700, "middle");
      return {r, box, tick, tx, strike, y, shift: 0};
    };
    const rows = (s.rows || ["Draft the launch checklist", "Review the onboarding emails", "Book the team retro"]).slice(0, 5).map((t, k) => mkRow(t, k, false));
    // cursor
    const cur = S("g", {}, g);
    S("path", {d: "M0 0 L0 34 L9 26 L15 40 L21 37 L15 24 L27 24 Z", fill: "#fff", stroke: "#11131f", "stroke-width": 2.5, "stroke-linejoin": "round"}, cur);
    let cx = WX + WW * .72, cy = WY + WH * .82;
    motion.set(cur, {x: cx, y: cy, opacity: 0});
    const steps = s.steps || [{click: "input"}, {type: "Write the release notes"}, {click: "button"}, {toast: "Task added"}];
    const n = steps.length, t0 = s.start + .6, per = Math.max(.8, (s.dur - 1.4) / n);
    tl.to(cur, {opacity: 1, duration: .3}, t0 - .3);
    const moveTo = (x, y, at) => { tl.to(cur, {x, y, duration: Math.min(.7, per * .55), ease: "power2.inOut"}, at); cx = x; cy = y; return at + Math.min(.7, per * .55); };
    const ripple = (x, y, at) => { const rp = S("circle", {cx: x, cy: y, r: 6, fill: "none", stroke: C.accent2, "stroke-width": 3}, g); motion.set(rp, {opacity: 0});
      tl.set(rp, {attr: {r: 6}, opacity: .9}, at); tl.to(rp, {attr: {r: 40}, opacity: 0, duration: .5, ease: "power2.out"}, at);
      tl.to(cur, {scale: .86, duration: .08, svgOrigin: `${x} ${y}`}, at); tl.to(cur, {scale: 1, duration: .14}, at + .08); cue(at, "click"); };
    let text = "", added = 0;
    steps.forEach((st, k) => {
      let at = t0 + k * per;
      if (st.click !== undefined) {
        const target = st.click === "button" || st.click === (s.button || "Add task") ? [MX + MW - BW / 2, IY + 34]
          : st.click === "input" ? [MX + 120, IY + 34] : typeof st.click === "number" && rows[st.click] ? [MX + 38, rows[st.click].y + rows[st.click].shift + 38] : [MX + 200, IY + 34];
        at = moveTo(target[0] - 4, target[1] - 4, at); ripple(target[0], target[1], at);
        if (st.click === "button" || st.click === (s.button || "Add task")) {
          tl.to(btn, {scale: .95, duration: .08}, at); tl.to(btn, {scale: 1, duration: .16}, at + .08);
          if (text) {
            const row = mkRow(text, 0, false); motion.set(row.r, {opacity: 0, y: -20});
            rows.forEach(r => { r.shift += RH + 12; tl.to(r.r, {y: r.shift, duration: .45, ease: "power3.out"}, at + .1); });
            tl.to(row.r, {opacity: 1, y: 0, duration: .45, ease: "power3.out"}, at + .15);
            tl.set(typed, {opacity: 0}, at + .1); tl.set(ph, {opacity: 1}, at + .1); tl.set(caret, {opacity: 0}, at + .1);
            rows.unshift(row); added++; text = ""; cue(at + .15, "pop");
          }
        }
        if (st.click === "input") { tl.set(ph, {opacity: 0}, at); tl.set(caret, {opacity: 1}, at); }
      } else if (st.type !== undefined) {
        const word = String(st.type), o = {n: 0}, dur = Math.min(per * .85, word.length * .045);
        tl.set(ph, {opacity: 0}, at); tl.set(typed, {opacity: 1}, at); tl.set(caret, {opacity: 1}, at);
        tl.to(o, {n: word.length, duration: dur, ease: "none", onUpdate() { typed.textContent = word.slice(0, Math.round(o.n)); caret.setAttribute("x", MX + 27 + typed.getComputedTextLength()); }}, at);
        for (let c = 0; c < word.length; c += 3) cue(at + c * dur / word.length, "tick");
        text = word;
      } else if (st.check !== undefined) {
        const r = rows[st.check + added] || rows[0];
        at = moveTo(MX + 34, r.y + r.shift + 34, at); ripple(MX + 38, r.y + r.shift + 38, at);
        tl.to(r.box, {attr: {fill: C.alt, stroke: C.alt}, duration: .2}, at); tl.to(r.tick, {opacity: 1, duration: .2}, at + .05);
        tl.to(r.strike, {opacity: 1, duration: .2}, at + .1); tl.to(r.tx, {fill: C.muted, duration: .3}, at + .1);
      } else if (st.toast !== undefined) {
        const tg = S("g", {}, g), tw = 420, tx = WX + WW - tw - 40, ty = WY + WH - 110;
        S("rect", {x: tx, y: ty, width: tw, height: 72, rx: 18, fill: "#ffffff", filter: "url(#softdark)"}, tg);
        S("circle", {cx: tx + 40, cy: ty + 36, r: 16, fill: C.alt}, tg);
        S("path", {d: `M${tx + 33} ${ty + 36} l5 5 l9 -10`, stroke: "#fff", "stroke-width": 3, fill: "none", "stroke-linecap": "round"}, tg);
        label(tg, tx + 72, ty + 45, st.toast, 24, "#11131f", 600);
        motion.set(tg, {opacity: 0, y: 30}); tl.to(tg, {opacity: 1, y: 0, duration: .4, ease: "power3.out"}, at); cue(at, "chime");
        tl.to(tg, {opacity: 0, duration: .3}, Math.min(s.start + s.dur - .4, at + 2.2));
      }
    });
  },
});

function particles() {
  const g = $("bgfx");
  for (let i = 0; i < 40; i++) {
    const c = S("circle", {cx: 40 + rnd() * 1840, cy: 80 + rnd() * 960, r: 1.4 + rnd() * 3, fill: [C.accent2, C.alt, C.muted][i % 3], opacity: (.15 + rnd() * .4).toFixed(2)}, g);
    tl.fromTo(c, {x: 0, y: 0}, {x: (rnd() - .5) * 120, y: -(80 + rnd() * 220), duration: TOTAL, ease: "none"}, 0);
  }
}

async function main() {
  await Promise.all(['700 40px "Space Grotesk"', '500 40px "IBM Plex Sans"', '600 40px "IBM Plex Sans"', '700 40px "IBM Plex Sans"'].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  if (BR.logo) await new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = BR.logo; });
  particles();
  SEGS.forEach((s, i) => (KINDS[s.kind] || KINDS.statement)(segment(s, i), s));
  tl.set({}, {}, TOTAL); tl.seek(0);
  window.TOTAL = TOTAL; window.SFX = SFX.sort((a, b) => a[0] - b[0]); window.renderAt = t => { tl.seek(t); }; window.READY = true;
}
main();
</script>
